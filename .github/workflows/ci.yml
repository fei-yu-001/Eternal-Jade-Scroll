# 纯逻辑 CI；真实 Unity 交互/构建在本地隔离工程验收。
# Python、存档、纸偶和收图检查各自保留失败退出码；独立检查仍会执行，便于完整定位。
# 地图布局/旧美术未通过的检查保持红色，详见本轮交付文档，不新增放行基线。
# UnityCompileChecks 依赖本机 Unity DLL；只有配置好引擎环境后才启用对应 job。

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: 纯逻辑门禁（不需要 Unity）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install python gate deps
        # 世界/地形类门禁依赖 numpy + Pillow；run-gates.sh 会自己挑一个装了这两个的解释器，
        # 挑不到就红着退出（不会假绿），所以这里必须装。
        run: python -m pip install --upgrade pip numpy pillow

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # ---- 1. python 侧门禁汇总 + 自证（防"某道关被静默跳过却算成绿"）----
      - name: run-gates.sh --self-check
        run: bash Tools/run-gates.sh --self-check

      # ---- 2. 纸偶骨架/步态数学与脚步 DSP（纯 C#）----
      - name: PuppetRigChecks
        if: ${{ !cancelled() }}
        run: dotnet run --project Tools/PuppetRigChecks/PuppetRigChecks.csproj

      # ---- 3. 存档 / 配置 / 经济 / 战斗表（纯 C#）----
      - name: SaveChecks
        if: ${{ !cancelled() }}
        run: dotnet run --project Tools/SaveChecks/SaveChecks.csproj

      # ---- 4. 外部收图预处理（去水印 / 统一取景 / 统一底色）的自证 ----
      - name: prep-external-art.py --selftest
        if: ${{ !cancelled() }}
        run: python Tools/prep-external-art.py --selftest

      # ---- 待补（等文件落地）----
      # - name: ingest-external-art.py --selftest
      #   run: python Tools/ingest-external-art.py --selftest
      # （TD-17 / TD-28 点名要纳入；本轮实测该文件不存在，故不启用。）

  unity-compile:
    name: 编译门（需要 Unity 托管 DLL，默认关闭）
    runs-on: ubuntu-latest
    # 见文件头第 1 条：UnityCompileChecks.csproj 硬编码了本机 Unity 路径，
    # 在 github-hosted runner 上必然失败，且那个失败不反映代码好坏。
    # ⇒ 默认不跑；有自托管 runner / 装了 Unity 的环境，把仓库变量 ENABLE_UNITY_COMPILE 设成 true 启用。
    # ⇒ **不许改成 continue-on-error**：那等于把红变绿。
    if: ${{ vars.ENABLE_UNITY_COMPILE == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 编译验收一律 --no-incremental（§2 通用规则第 1 条：增量构建会造出假象）。
      - name: UnityCompileChecks
        run: dotnet build Tools/UnityCompileChecks/UnityCompileChecks.csproj --no-incremental
